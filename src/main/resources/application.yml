spring:
  application:
    name: formai-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:formai_db}
    username: ${DB_USER:quedena}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: public
    open-in-view: false

  # Transactional email through Brevo's SMTP relay (US-005). Without SMTP_USER/SMTP_PASSWORD the
  # application still starts; SmtpEmailDeliveryService just reports the delivery as failed.
  mail:
    host: ${SMTP_HOST:smtp-relay.brevo.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true   # never send credentials or the reset link in clear text
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  flyway:
    enabled: false   # each module runs its own Flyway instance with its own history table (see shared/config/FlywayConfig)

server:
  port: ${SERVER_PORT:8080}

formai:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}   # NFR-007: refresh token lifetime
    cookie-secure: ${JWT_COOKIE_SECURE:true}   # false only for local development over plain HTTP

cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}

tracking:
  jobs:
    workout-session-daily:
      cron: ${TRACKING_DAILY_JOB_CRON:0 5 0 * * *}   # every day at 00:05 (server time zone)

notifications:
  password-reset-url: ${PASSWORD_RESET_URL:http://localhost:5173/password-reset?token=}   # the token is appended
  email:
    from-address: ${SMTP_FROM_EMAIL:}   # sender verified in Brevo
    from-name: ${SMTP_FROM_NAME:FormAI}
  jobs:
    dispatcher:
      delay: ${NOTIFICATIONS_DISPATCHER_DELAY:PT1M}   # how often due notifications are sent

documentation:
  application:
    description: 'FormAI API — modular monolith (Bounded Contexts: iam, clients, planning, tracking, notifications)'
    version: '@project.version@'

management:
  endpoints:
    web:
      exposure:
        include: health   # only health — never expose env/beans/heapdump by default
  endpoint:
    health:
      show-details: never   # UP/DOWN only; no infra details to an unauthenticated caller
  health:
    mail:
      enabled: false   # the healthcheck must not depend on (or open a connection to) the SMTP relay
