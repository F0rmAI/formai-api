spring:
  application:
    name: formai-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:formai_db}
    username: ${DB_USER:quedena}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: public
    open-in-view: false

  flyway:
    enabled: false   # each module runs its own Flyway instance with its own history table (see shared/config/FlywayConfig)

server:
  port: ${SERVER_PORT:8080}

formai:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}

cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}

tracking:
  jobs:
    workout-session-daily:
      cron: ${TRACKING_DAILY_JOB_CRON:0 5 0 * * *}   # every day at 00:05 (server time zone)

notifications:
  password-reset-url: ${PASSWORD_RESET_URL:http://localhost:5173/password-reset?token=}   # the token is appended
  jobs:
    dispatcher:
      delay: ${NOTIFICATIONS_DISPATCHER_DELAY:PT1M}   # how often due notifications are sent

documentation:
  application:
    description: 'FormAI API — modular monolith (Bounded Contexts: iam, clients, planning, tracking, notifications)'
    version: '@project.version@'

management:
  endpoints:
    web:
      exposure:
        include: health   # only health — never expose env/beans/heapdump by default
  endpoint:
    health:
      show-details: never   # UP/DOWN only; no infra details to an unauthenticated caller
