name: CI

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop, 'release/**']

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: qs_template_db
          POSTGRES_USER: quedena
          POSTGRES_PASSWORD: quedena
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: qs_template_db
      DB_USER: quedena
      DB_PASSWORD: quedena
      JWT_SECRET: ci-only-secret-never-used-outside-this-ephemeral-pipeline
      CORS_ALLOWED_ORIGIN: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run test suite
        run: mvn -B test
