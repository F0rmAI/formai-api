services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-qs_template_db}
      POSTGRES_USER: ${DB_USER:-quedena}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
